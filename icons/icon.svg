<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 通勤碼表的圖示：碼表外框（三色是等車、乘車、轉乘），錶面是軌道列車正面 -->
  <rect width="512" height="512" rx="112" fill="#1f2a33"/>
  <!-- 碼表上方的按鈕 -->
  <rect x="222" y="62" width="68" height="34" rx="12" fill="#e6eaee"/>
  <rect x="243" y="90" width="26" height="40" fill="#e6eaee"/>
  <!-- 三色外圈：等車（黃）、乘車（藍）、轉乘（紫），之間留缺口 -->
  <g fill="none" stroke-width="46" transform="rotate(-90 256 290)">
    <circle cx="256" cy="290" r="140" pathLength="360" stroke="#e8a33d" stroke-dasharray="74 286" stroke-dashoffset="-4"/>
    <circle cx="256" cy="290" r="140" pathLength="360" stroke="#3b82c4" stroke-dasharray="172 188" stroke-dashoffset="-86"/>
    <circle cx="256" cy="290" r="140" pathLength="360" stroke="#9b6bc9" stroke-dasharray="86 274" stroke-dashoffset="-270"/>
  </g>
  <!-- 列車正面：車窗、頭燈 -->
  <rect x="200" y="226" width="112" height="124" rx="30" fill="#e6eaee"/>
  <rect x="214" y="242" width="84" height="46" rx="12" fill="#1f2a33"/>
  <circle cx="226" cy="320" r="10" fill="#e8a33d"/>
  <circle cx="286" cy="320" r="10" fill="#e8a33d"/>
  <!-- 鐵軌 -->
  <g stroke="#e6eaee" stroke-width="10" stroke-linecap="round">
    <line x1="232" y1="356" x2="214" y2="396"/>
    <line x1="280" y1="356" x2="298" y2="396"/>
    <line x1="224" y1="376" x2="288" y2="376"/>
  </g>
</svg>
