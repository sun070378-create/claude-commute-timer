<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1f2a33">
  <title>通勤碼表</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>通勤碼表</h1>
    <nav class="tabs">
      <button class="tab active" data-view="record">記錄</button>
      <button class="tab" data-view="stats">統計</button>
      <button class="tab" data-view="history">我的紀錄</button>
    </nav>
  </header>

  <main>
    <p id="mode-banner" class="banner" hidden></p>

    <!-- ===== 記錄：一、設定起訖點 ===== -->
    <section id="view-setup" class="view">
      <!-- 常用路線：有存過才會出現，一張卡片包含去程和回程 -->
      <div id="saved-wrap" hidden>
        <h2>常用路線</h2>
        <div id="saved-list"></div>
        <h3>或選擇其他路線</h3>
      </div>
      <h2 id="setup-title">這趟從哪到哪？</h2>
      <div class="field">
        <span>起點站</span>
        <button id="origin" class="station-field" type="button"></button>
      </div>
      <button id="swap" class="link-btn" type="button">⇅ 對調</button>
      <div class="field">
        <span>終點站</span>
        <button id="destination" class="station-field" type="button"></button>
      </div>
      <!-- 進階選項：平常收起來，需要時再展開 -->
      <details id="more" class="more">
        <summary>更多選項：到站／離站方式 <span id="more-summary" class="more-summary"></span></summary>
        <div class="field">
          <span id="access-label"></span>
          <div id="access-modes" class="chips"></div>
        </div>
        <div class="field">
          <span id="egress-label"></span>
          <div id="egress-modes" class="chips"></div>
        </div>
        <p class="hint">選了之後，碼表會多出「前往車站」或「前往目的地」一段。這兩段因人而異，不列入大家的車站到車站統計。</p>
      </details>
      <button id="start" class="big-btn primary" type="button">準備出發</button>
      <button id="save-route" class="link-btn" type="button">☆ 把這條路線存成常用路線</button>
      <div id="save-form" class="save-form" hidden>
        <input id="route-name" type="text" maxlength="12" placeholder="名稱，例如：通勤">
        <button id="save-confirm" class="small-btn" type="button">儲存</button>
      </div>
      <p class="hint">存起來之後，去程和回程都能一鍵出發，到站／離站方式也會一起記住。</p>
      <p class="hint">進站後到了月台再按「開始等車」。過程中可以關掉螢幕或切到別的 App，時間會照算。</p>
    </section>

    <!-- ===== 記錄：二、碼表 ===== -->
    <section id="view-track" class="view" hidden>
      <p class="route"><span id="track-origin"></span> → <span id="track-dest"></span></p>
      <p id="phase-label" class="phase-label"></p>
      <p id="phase-timer" class="timer">0:00</p>
      <p class="total-line">全程 <span id="total-timer">0:00</span></p>

      <div id="actions" class="actions"></div>

      <ol id="timeline" class="timeline"></ol>

      <div class="secondary-actions">
        <button id="undo" class="link-btn" type="button">↶ 按錯了，復原上一步</button>
        <button id="cancel" class="link-btn danger" type="button">放棄這趟</button>
      </div>
    </section>

    <!-- ===== 記錄：三、結果確認 ===== -->
    <section id="view-summary" class="view" hidden>
      <h2><span id="sum-title">這趟花了</span> <span id="sum-total"></span></h2>
      <p class="route"><span id="sum-route"></span></p>
      <div id="sum-bar" class="stack-bar"></div>
      <ul id="sum-parts" class="legend"></ul>
      <p id="sum-door" class="hint" hidden></p>
      <label class="field">
        <span>備註（選填，例如：遇到延誤、下大雨）</span>
        <input id="note" type="text" maxlength="200">
      </label>
      <button id="submit" class="big-btn primary" type="button">送出這筆紀錄</button>
      <button id="discard" class="link-btn danger" type="button">不要送出</button>
      <p id="submit-msg" class="hint"></p>
    </section>

    <!-- ===== 統計 ===== -->
    <section id="view-stats" class="view" hidden>
      <h2>大家實測的通勤時間</h2>
      <div class="filters">
        <label class="field">
          <span>路線</span>
          <select id="stats-pair"></select>
        </label>
        <label class="field">
          <span>時段</span>
          <select id="stats-band">
            <option value="all">全部</option>
            <option value="peak">平日尖峰（7–9、17–19 點）</option>
            <option value="offpeak">平日離峰</option>
            <option value="weekend">假日</option>
          </select>
        </label>
      </div>
      <div id="stats-body"></div>
      <h3>熱門路線</h3>
      <ol id="stats-popular" class="popular"></ol>
      <button id="export" class="link-btn" type="button">下載全部資料（CSV）</button>
    </section>

    <!-- ===== 我的紀錄 ===== -->
    <section id="view-history" class="view" hidden>
      <h2>我送出過的紀錄</h2>
      <p class="hint">只存在這台裝置上。</p>
      <ol id="history-list" class="history"></ol>
    </section>
  </main>

  <!-- ===== 選站視窗：先選路線，再選車站；也可以直接搜尋 ===== -->
  <dialog id="picker" class="picker">
    <div class="picker-head">
      <button id="picker-back" class="icon-btn" type="button" aria-label="回到路線列表">‹</button>
      <h2 id="picker-title">選擇起點站</h2>
      <button id="picker-close" class="icon-btn" type="button" aria-label="關閉">✕</button>
    </div>
    <input id="picker-search" class="picker-search" type="search" placeholder="搜尋站名，例如：紅樹林" autocomplete="off">
    <div id="picker-body" class="picker-body"></div>
  </dialog>

  <script src="config.js"></script>
  <script src="stations.js"></script>
  <script src="app.js"></script>
</body>
</html>
